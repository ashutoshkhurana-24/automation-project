name: check

# The offline checks only: a syntax check of server.js, the voice grammar
# against this house's own device list, and the wording of every spoken reply.
# Nothing here can reach a hub, a television or a model.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
