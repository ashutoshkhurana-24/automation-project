# Wait for DNS, not for ICMP.
#
# The unit's own ExecStartPre waits on `ping 8.8.8.8`, then sleeps 30s, then
# Django immediately calls Firebase. ICMP comes up before the resolver does, so
# on 2026-09-13 that wait passed too early: the app crashed at boot with
# "Temporary failure in name resolution", never bound 8090, and sat dead for
# five hours while reporting itself `active`.
#
# Drop-in ExecStartPre APPENDS, so this runs last - after the sleep 30, which is
# exactly where the resolver needs to be up.
#
# Bounded at 40s, and the `-` prefix ignores a non-zero exit. TimeoutStartSec is
# 90s and the sleep already spends 30 of it, so an unbounded wait would fail the
# unit outright - worse than the bug. If DNS really is still down at 40s the app
# starts and crashes as before, which watchdog.sh now heals.
#
# The name is deliberately a neutral one rather than the app's own Firebase host.
# A resolver is either answering or it is not, so any public name proves it just
# as well - while a per-install cloud endpoint written into a repo is an address
# published for no gain. The unit already assumes 8.8.8.8 is reachable, so this
# is the DNS half of the check it is making one line above.
[Service]
ExecStartPre=-/usr/bin/timeout 40 /bin/bash -c 'until getent hosts google.com >/dev/null 2>&1; do sleep 2; done'
